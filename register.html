<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Portal - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Campus Student Portal</h1><p>Student registration page</p></header>
  <nav>
    <a href="index.html">Home</a>
    <a href="register.html">Register</a>
    <a href="students.html">Students</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main class="container">

    <section class="card">
      <h2>Student Registration Form</h2>
      <form action="#" method="post">
        <div class="form-grid">
          <div class="form-group"><label for="name">Full Name</label><input type="text" id="name" name="name" placeholder="Enter your name" required></div>
          <div class="form-group"><label for="email">Email Address</label><input type="email" id="email" name="email" placeholder="name@example.com" required></div>
          <div class="form-group"><label for="phone">Phone Number</label><input type="tel" id="phone" name="phone" placeholder="Enter phone number"></div>
          <div class="form-group"><label for="dob">Date of Birth</label><input type="date" id="dob" name="dob"></div>
          <div class="form-group"><label for="course">Select Course</label><select id="course" name="course" required><option value="">Choose a course</option><option>BCA</option><option>B.Tech</option><option>B.Sc.</option><option>MCA</option></select></div>
          <div class="form-group"><label for="year">Year of Study</label><select id="year" name="year"><option value="">Choose year</option><option>First Year</option><option>Second Year</option><option>Third Year</option><option>Fourth Year</option></select></div>
        </div>
        <div class="form-group"><label>Gender</label><div class="radio-options"><label><input type="radio" name="gender" value="Male"> Male</label><label><input type="radio" name="gender" value="Female"> Female</label><label><input type="radio" name="gender" value="Other"> Other</label></div></div>
        <div class="form-group"><label for="address">Address</label><textarea id="address" name="address" rows="3" placeholder="Enter your address"></textarea></div>
        <label class="checkbox-label"><input type="checkbox" required> I confirm that the information is correct.</label>
        <button type="submit">Submit Registration</button>
      </form>
    </section>
  </main>
  <footer><p>© 2026 Campus Student Portal | HTML and CSS Practice Project</p></footer>
</body>
</html>
